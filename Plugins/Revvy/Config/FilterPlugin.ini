[FilterPlugin]
; Revvy Plugin Filter Configuration
; This file lists all folders and files outside the standard UE plugin structure
; that should be included in the distribution for FAB Marketplace

; Standard UE Plugin Structure (included automatically)
; - Content/
; - Resources/
; - Source/
; - Binaries/ (excluded - rebuilt on target platform)
; - Intermediate/ (excluded - build artifacts)

; Custom Files to Include
/Revvy.uplugin

/README.md

; Cross-platform Python CLI launcher (Windows wrapper at plugin root)
/revvy.cmd

; Windowed desktop launcher and local EXE build script
/RevvyApp.vbs
/BuildRevvyApp.ps1

/FilterPlugin.ini

; MCP Configuration for AI Chat to use other MCP Servers
/Config/revvy.mcp.json

; Runtime Python modules: MCP proxy (stdlib-only, for external AI client connections),
; the desktop app, image generation, and typed Blender MCP
/Content/Python/...

; Shared voice/persona instructions for Unreal and the desktop app
/Content/instructions/...

; Runtime skills and Blender bridge package
/Content/Skills/...
/Content/Blender/...

; Test Prompts and Examples (for user reference)
/test_prompts/...

