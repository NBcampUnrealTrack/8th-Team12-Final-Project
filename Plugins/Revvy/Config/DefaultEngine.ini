; Revvy plugin config.
; CoreRedirects: migrate reflected type names from the legacy "Revvy" brand
; to "Revvy" so any serialized references resolve. These structs/enum are
; runtime/return types (not asset-stored), so redirects are belt-and-suspenders.
[CoreRedirects]
+EnumRedirects=(OldName="ERevvyTaskStatus",NewName="ERevvyTaskStatus")
+StructRedirects=(OldName="RevvyTaskItem",NewName="RevvyTaskItem")
+StructRedirects=(OldName="RevvyFoliageTypeInfo",NewName="RevvyFoliageTypeInfo")
+StructRedirects=(OldName="RevvyMaterialFunctionInfo",NewName="RevvyMaterialFunctionInfo")
+StructRedirects=(OldName="RevvyMaterialInstanceInfo",NewName="RevvyMaterialInstanceInfo")
+StructRedirects=(OldName="RevvyMontageBlendSettings",NewName="RevvyMontageBlendSettings")
+StructRedirects=(OldName="RevvyAssertInfo",NewName="RevvyAssertInfo")
