; ─────────────────────────────────────────────────────────────
; BurgerHouse (구 projectll / Burgeria) 이식 리다이렉트
;
; 에셋(ST_Customer·BP_Customer·L_BurgerHouse)은 타입을 **이름 문자열로**
; 참조한다. 모듈이 projectll -> Febricula 로, 타입이 Burgeria* ->
; BurgerHouse* 로 둘 다 바뀌었으므로 아래가 없으면 StateTree 태스크가
; **조용히 사라진다** (에러 없이 빈 상태가 된다).
;
; ⚠ 두 벌씩 적는 이유 — PackageRedirects 가 먼저 적용되면 조회 이름이
;   이미 /Script/Febricula.Burgeria* 가 되어 있을 수 있다. 둘 다 걸어 둔다.
; ─────────────────────────────────────────────────────────────
