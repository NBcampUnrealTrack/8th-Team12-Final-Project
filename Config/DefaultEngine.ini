; ⚠ BurgerHouse — 손님 캡슐(반지름 34 · 전체높이 176)에 맞춘 내비 에이전트.
;
;   ACustomerCharacter 는 InitCapsuleSize 를 오버라이드하지 않아 ACharacter
;   기본값을 쓴다 (radius 34 · half-height 88 → 전체 176).
;   Engine/Source/Runtime/Engine/Private/Character.cpp:78
;
;   이 값이 없으면 엔진이 FallbackAgentRadius/Height (하드코딩 35 / 144) 로
;   내비를 굽고, 176 짜리 손님이 144 용 내비 위를 걷게 된다. 「내비 설정이
;   기본값으로 되돌아간다」로 보이는 증상의 정체다.
;
; ⚠⚠ 팀 공용 설정이다 — 이 프로젝트의 **다른 NPC 내비에도 영향을 준다.**
;    Develop 에 머지하기 전에 다른 캐릭터 캡슐 크기와 맞는지 확인할 것.
AgentRadius=34.0
AgentHeight=176.0
; AgentMaxHeight 는 AgentHeight 이상이어야 한다. 엔진 기본 160 은 모자란다.
AgentMaxHeight=192.0
AgentMaxStepHeight=35.0
AgentMaxSlope=44.0

[/Script/NavigationSystem.NavigationSystemV1]
; ⚠ **에이전트 크기를 실제로 정하는 건 여기다** — 위 RecastNavMesh 블록이 아니다.
;   SupportedAgents 가 비어 있으면 엔진이 FNavDataConfig 를 하드코딩 35/144 로
;   만들어 RecastNavMesh 값을 덮어쓴다. 되읽어 확인한 사실이다.
bAutoCreateNavigationData=True
