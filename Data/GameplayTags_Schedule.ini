; Config/DefaultGameplayTags.ini 의 [/Script/GameplayTags.GameplayTagsSettings] 섹션에 붙여넣으세요.
; (또는 프로젝트 세팅 > GameplayTags 에서 하나씩 추가해도 됩니다)
;
; 축이 두 개로 나뉘어 있는 게 핵심입니다:
;   Schedule.*  = 하루 안에서의 시간대   ("지금 몇 교시인가")
;   DayType.*   = 날의 종류             ("오늘이 어떤 날인가")
;
; 이렇게 두면 "기상 시간대인가"를 물을 때 평일용/주말용 태그를 따로 나열할 필요가 없습니다.

[/Script/GameplayTags.GameplayTagsSettings]

; ---- 시간대 (FScheduleDef.ScheduleName 에 넣는 값) ----
+GameplayTagList=(Tag="Schedule.WakeUp",DevComment="기상")
+GameplayTagList=(Tag="Schedule.MorningAssembly",DevComment="조회")
+GameplayTagList=(Tag="Schedule.MorningActivity",DevComment="오전 활동")
+GameplayTagList=(Tag="Schedule.Breakfast",DevComment="아침 식사")
+GameplayTagList=(Tag="Schedule.MorningClass",DevComment="오전 수업")
+GameplayTagList=(Tag="Schedule.Lunch",DevComment="점심")
+GameplayTagList=(Tag="Schedule.AfternoonClass",DevComment="오후 수업")
+GameplayTagList=(Tag="Schedule.Dinner",DevComment="저녁 식사")
+GameplayTagList=(Tag="Schedule.NightAssembly",DevComment="야간 점호")

; 자유시간은 계열로 묶어두면 ScheduleIsChildOf(Schedule.FreeTime) 한 줄로 전부 잡힙니다.
+GameplayTagList=(Tag="Schedule.FreeTime.Morning",DevComment="자유시간 1")
+GameplayTagList=(Tag="Schedule.FreeTime.Afternoon",DevComment="자유시간 2")
+GameplayTagList=(Tag="Schedule.FreeTime.Night",DevComment="자유시간 3")

; ---- 날 종류 (UDayScheduleAsset.DayTypeTag 에 넣는 값) ----
+GameplayTagList=(Tag="DayType.WeekDay",DevComment="평일")
+GameplayTagList=(Tag="DayType.WeekEnd",DevComment="주말")

; 나중에 늘어날 것들. 미리 등록해두면 C++ 수정 없이 시간표 애셋만 추가하면 됩니다.
+GameplayTagList=(Tag="DayType.ExamWeek",DevComment="시험 기간")
+GameplayTagList=(Tag="DayType.Vacation",DevComment="방학")
+GameplayTagList=(Tag="DayType.Festival",DevComment="축제")
